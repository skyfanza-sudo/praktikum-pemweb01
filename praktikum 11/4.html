<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow jQuery Fade</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        .slideshow-container {
            position: relative;
            max-width: 600px;
            margin: auto;
            text-align: center;
        }

        .slide {
            display: none;      
            width: 100px;
            height: auto;
            margin: 0 auto;    
        }

        .slide:first-child {
            display: block;    
        }

        .buttons {
            margin-top: 10px;
            text-align: center;
        }

        .btn {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 0 5px;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="slideshow-container">
        <img class="slide" src="img/1.jpg" alt="Gambar 1">
        <img class="slide" src="img/2.jpg" alt="Gambar 2">
        <img class="slide" src="img/3.jpg" alt="Gambar 3">
    </div>

    <div class="buttons">
        <button id="prevBtn" class="btn">Sebelumnya</button>
        <button id="nextBtn" class="btn">Berikutnya</button>
    </div>

    <script>
        $(document).ready(function(){
            var slides = $('.slide');
            var currentSlide = 0;
            var fadeSpeed = 800;

            function showSlide(index) {
                slides.eq(currentSlide).fadeOut(fadeSpeed, function() {
                    currentSlide = index;
                    slides.eq(currentSlide).fadeIn(fadeSpeed);
                });
            }

            $('#nextBtn').click(function() {
                var nextIndex = (currentSlide + 1) % slides.length;
                showSlide(nextIndex);
            });

            $('#prevBtn').click(function() {
                var prevIndex = (currentSlide - 1 + slides.length) % slides.length;
                showSlide(prevIndex);
            });
        });
    </script>

</body>
</html>
