<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan javaScript: INLLINE, INTERNAL, EKSTERNAL</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f4f4f4;
      line-height: 1.6;
    }
    h2 {
      margin-top: 30px;
    }
    button {
      padding: 10px 18px;
      margin: 6px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 6px;
    }
    button:hover {
      opacity: 0.9;
    }
    #box {
      margin-top: 10px;
    }
    hr {
      margin: 30px 0;
    }
  </style>

  <script>
    function ubahteks() {
        document.getElementById("judul").innerText =
        "teks sudah berubah oleh javascript!";
    }
    function ubahwarna() {
        document.getElementById("judul").style.color =
        "yellow";
    }
  </script>
</head>
<body>
    <h2> praktik inline javascript</h2>
    <button onclick="alert ('Halo, saya belajar javascript')">
        Klik saya (onclick)
    </button>

     <button onmouseover="alert ('Mouse sedang berada diatasb tombol!')">
        Arahkan Mouse (onmouseover)
    </button>

    <button ondblclick="alert ('Tombol diklik dua kali!')">
        Klik dua Kali (ondblclick)
    </button>
    <hr>

    <h2>Praktikum Internal JavaScript</h2>
    <h3 id="judul">ini judul awal</h3>

    <button onclick="ubahteks()">UbahJudul</button>
    <button onclick="ubahwarna()">UbahWarna</button>
    
</body>
</html>
